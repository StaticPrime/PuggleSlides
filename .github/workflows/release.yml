# Builds the installer for a version tag (vMAJOR.MINOR.FIX, pushed by Tools/release.sh) and publishes
# it as a GitHub release. The installer keeps the same name in every release, so
# https://github.com/<owner>/<repo>/releases/latest/download/<App>.pkg always downloads the newest one.
# Next to it goes update.json, which describes it (version, build, minimum macOS, address, size and SHA-256)
# for the apps' own update check: they read .../releases/latest/download/update.json as they open.
#
# With these repository secrets, the app and the installer are signed with the Developer ID and the
# installer is notarized by Apple, so it opens without any warning:
#   DEVELOPER_ID_P12_BASE64     a .p12 file holding the "Developer ID Application" and "Developer ID
#                               Installer" certificates with their private keys, base64-encoded
#   DEVELOPER_ID_P12_PASSWORD   the .p12 file's password
#   NOTARY_API_KEY              an App Store Connect API key (the .p8 file's text), for notarizing
#   NOTARY_KEY_ID               that key's ID
#   NOTARY_ISSUER_ID            the issuer ID shown above the keys in App Store Connect
# Without them, the release is published unsigned, with a warning. And for an app that uses iCloud (one with
# Config/iCloud.entitlements), this one too, or a signed release stops rather than publish a copy without iCloud:
#   DEVELOPER_ID_PROFILE_BASE64 a Developer ID provisioning profile, base64-encoded, for an app that uses
#                               iCloud or pushes: the app is signed with what it allows
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the installer
    # GitHub's Xcode 27 image (macOS 27, Apple silicon), the Xcode the apps are developed with. It's still
    # marked preview, so a job can wait 10 minutes or more for a machine to start. Don't switch to
    # macos-26: its Xcode 26.6 compiler crashes optimizing PuggleDocs for release.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      SIGNING_CONFIGURED: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
    steps:
      - name: Check out the tag
        # actions/checkout v7.0.1, pinned to its commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check that the tag matches the app's version
        run: |
          app=$(basename *.xcodeproj .xcodeproj)
          version=$(grep -o 'MARKETING_VERSION = [^;]*;' "$app.xcodeproj/project.pbxproj" | sort -u | sed -E 's/.* = "?([^";]*)"?;/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the project's MARKETING_VERSION is $version. Release with Tools/release.sh, which keeps them together."
            exit 1
          fi
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          xcodebuild -version

      # A failure is repeated as an error annotation (its errors, or else the last lines of its output),
      # so the reason shows on the run's summary page. The installer is built even when tests fail, so one
      # run reports every problem; nothing is published unless both succeed.
      - name: Run the package tests
        run: |
          set -o pipefail
          if ! swift test --package-path "Packages/${APP}Kit" 2>&1 | tee "$RUNNER_TEMP/tests.log"; then
            lines=$(grep -E "error:|✘" "$RUNNER_TEMP/tests.log" | sort -u | head -15 || true)
            [ -n "$lines" ] || lines=$(tail -25 "$RUNNER_TEMP/tests.log")
            lines=${lines//'%'/'%25'}; lines=${lines//$'\r'/}; lines=${lines//$'\n'/'%0A'}
            echo "::error title=Package tests failed::$lines"
            exit 1
          fi

      # Puts the Developer ID certificates in a keychain of their own, readable by codesign and
      # productbuild without a prompt, and tells Tools/make-installer.sh which identities and key to use.
      - name: Set up Developer ID signing
        if: ${{ !cancelled() && env.SIGNING_CONFIGURED == 'true' }}
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          for name in P12_PASSWORD NOTARY_API_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::DEVELOPER_ID_P12_BASE64 is set but the secret for $name is missing."
              exit 1
            fi
          done
          if [ -f Config/iCloud.entitlements ] && [ -z "$PROFILE_BASE64" ]; then
            echo "::error::This app uses iCloud, but the repository secret DEVELOPER_ID_PROFILE_BASE64 is missing or empty, so its installer couldn't be signed for iCloud. Add the Developer ID provisioning profile, base64-encoded (see the top of release.yml), and release again."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Apple's intermediate certificate, so the chain checks out even if the image lacks it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            && security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" > /dev/null 2>&1 || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          application=$(security find-identity -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          installer=$(security find-identity -p basic "$keychain" | grep -o '"Developer ID Installer: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$application" ] || [ -z "$installer" ]; then
            echo "::error::The .p12 file needs both a Developer ID Application and a Developer ID Installer certificate, each with its private key."
            exit 1
          fi
          printf '%s\n' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary-key.p8"
          if [ -n "$PROFILE_BASE64" ]; then
            printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.provisionprofile"
            if ! security cms -D -i "$RUNNER_TEMP/developer-id.provisionprofile" > /dev/null 2>&1; then
              echo "::error::The secret DEVELOPER_ID_PROFILE_BASE64 isn't a base64-encoded provisioning profile. Copy it again with: base64 -i <the profile> | pbcopy"
              exit 1
            fi
            echo "DEVELOPER_ID_PROFILE=$RUNNER_TEMP/developer-id.provisionprofile" >> "$GITHUB_ENV"
          fi
          {
            echo "DEVELOPER_ID_APPLICATION=$application"
            echo "DEVELOPER_ID_INSTALLER=$installer"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Note that this release won't be signed
        if: ${{ !cancelled() && env.SIGNING_CONFIGURED != 'true' }}
        run: echo "::warning::The repository has no Developer ID secrets, so this installer is unsigned and macOS will ask people to allow it in Privacy & Security. See the comment at the top of release.yml."

      - name: Build the installer
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          if ! Tools/make-installer.sh 2>&1 | tee "$RUNNER_TEMP/installer.log"; then
            lines=$(grep -E "error:" build/Installer/build.log 2>/dev/null | sort -u | head -15 || true)
            [ -n "$lines" ] || lines=$(grep -i -E "error|fatal|stack dump|signal|crash|killed|terminat|assert|memory|nonzero" build/Installer/build.log 2>/dev/null | cut -c1-200 | awk '!seen[$0]++' | head -18 || true)
            [ -n "$lines" ] || lines=$(grep -v -E "^\s*$" build/Installer/build.log 2>/dev/null | cut -c1-200 | tail -18 || true)
            [ -n "$lines" ] || lines=$(tail -25 "$RUNNER_TEMP/installer.log")
            lines=${lines//'%'/'%25'}; lines=${lines//$'\r'/}; lines=${lines//$'\n'/'%0A'}
            echo "::error title=Installer build failed::$lines"
            exit 1
          fi

      # What the apps' update check reads (see the top of this file): the installer's address in this release,
      # its size and its SHA-256, which the app checks the download against before installing it.
      - name: Describe the update for the apps' update check
        run: |
          pkg="build/$APP.pkg"
          info="build/Installer/$APP.xcarchive/Products/Applications/$APP.app/Contents/Info.plist"
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$info")
          minimum=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$info")
          size=$(stat -f %z "$pkg")
          sha256=$(shasum -a 256 "$pkg" | cut -d ' ' -f 1)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$APP.pkg"
          printf '{\n  "version": "%s",\n  "build": %s,\n  "minimumSystemVersion": "%s",\n  "url": "%s",\n  "size": %s,\n  "sha256": "%s"\n}\n' \
            "$VERSION" "$build" "$minimum" "$url" "$size" "$sha256" > build/update.json
          # Reading every field back checks the file is JSON the apps can read.
          for key in version build minimumSystemVersion url size sha256; do
            plutil -extract "$key" raw -o - build/update.json > /dev/null
          done
          cat build/update.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/$APP.pkg" build/update.json \
            --verify-tag --latest --generate-notes --title "$APP $VERSION"

      - name: Remove the signing keychain and key
        if: ${{ always() && env.SIGNING_KEYCHAIN != '' }}
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.provisionprofile"
